[project]
name = "crawl-server"
version = "0.0.1"
description = "Crawl MCP server (stub): sitemap discovery, page fetching, structured data extraction (P2+)."
requires-python = ">=3.12"
dependencies = [
  # mcp 2.x renamed FastMCP to MCPServer; docs name FastMCP. Revisit before P2.
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
]

[project.scripts]
crawl-server = "crawl_server.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawl_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
